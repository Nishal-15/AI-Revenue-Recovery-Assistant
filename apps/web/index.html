<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revenue Recovery · Win back missed dental bookings</title>
    <meta name="description" content="Finds missed enquiries, unconfirmed appointments and patients due back, and reminds them on WhatsApp." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f2c31" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved colour theme before the first paint, so the page never flashes the wrong colours.
      (function () {
        var choice = "dark";
        try { choice = localStorage.getItem("rr-theme") || "dark"; } catch (e) {}
        var theme = choice === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : choice;
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
